openapi: 3.1.0
info:
  title: Swasthya Healthcare API Contract
  version: 1.0.0
  description: Production REST API specification for Swasthya public health platform
    (SIH26133). Fully typed against Lane B contracts.
  license:
    name: Proprietary / Government of India SIH-2026
    url: https://www.sih.gov.in/
servers:
- url: https://api.swasthya.gov.in/v1
  description: Production Gateway
- url: https://staging.swasthya.gov.in/v1
  description: Staging Sandbox
security:
- bearerAuth: []
paths:
  /auth/otp/request:
    post:
      summary: Request OTP for phone number
      operationId: requestOtp
      x-roles:
      - PUBLIC
      x-facility-scoped: false
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400':
          description: Validation or bad request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden - role or facility scope mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict (e.g. SLOT_FULL, CONCURRENT_MODIFICATION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInput'
