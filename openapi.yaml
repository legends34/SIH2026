components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT containing sub (userId), role, facilityId (for staff), and
        patientIds (for citizens).
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - correlation_id
          properties:
            code:
              type: string
              example: SLOT_FULL
            message:
              type: string
              example: The requested OPD slot has reached maximum capacity.
            details:
              type: object
              additionalProperties: true
            correlation_id:
              type: string
              example: req_4f89d31a
    ApiResponse:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
    User:
      type: object
      required:
      - id
      - phone
      - role
      - registeredAt
      properties:
        id:
          type: string
          example: usr_sunita_01
        phone:
          type: string
          example: '+919876543210'
        role:
          type: string
          enum:
          - CITIZEN
          - DOCTOR
          - PHARMACIST
          - FACILITY_ADMIN
          - DISTRICT_ADMIN
          - STATE_ADMIN
        patientIds:
          type: array
          items:
            type: string
        facilityId:
          type: string
          example: fac_gurugram_phc_01
        departmentCode:
          type: string
          example: GEN_MED
        registeredAt:
          type: string
          format: date-time
    Patient:
      type: object
      required:
      - id
      - fullName
      - dateOfBirth
      - ageYears
      - sex
      - preferredLanguage
      properties:
        id:
          type: string
          example: pat_sunita_01
        fullName:
          type: string
          example: Sunita Devi
        dateOfBirth:
          type: string
          format: date
        ageYears:
          type: integer
          minimum: 0
          maximum: 130
        sex:
          type: string
          enum:
          - male
          - female
          - other
        aadhaarLast4:
          type: string
          pattern: ^[0-9]{4}$
        preferredLanguage:
          type: string
          example: hi
    Facility:
      type: object
      required:
      - id
      - name
      - tier
      - district
      - taluka
      - pincode
      - latitude
      - longitude
      - departments
      - verified
      properties:
        id:
          type: string
          example: fac_gurugram_phc_01
        name:
          type: string
          example: Gurugram Sector 4 PHC
        tier:
          type: string
          enum:
          - sub_centre
          - phc
          - chc
          - sdh
          - dh
        district:
          type: string
          example: Gurugram
        taluka:
          type: string
          example: Gurugram
        pincode:
          type: string
          pattern: ^[0-9]{6}$
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        departments:
          type: array
          items:
            type: string
        verified:
          type: boolean
    Slot:
      type: object
      required:
      - id
      - facilityId
      - departmentCode
      - date
      - startTime
      - endTime
      - capacity
      - bookedCount
      properties:
        id:
          type: string
          example: slot_gurugram_01
        facilityId:
          type: string
        departmentCode:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          example: 09:00
        endTime:
          type: string
          example: '13:00'
        capacity:
          type: integer
          minimum: 1
        bookedCount:
          type: integer
          minimum: 0
    Appointment:
      type: object
      required:
      - id
      - slotId
      - patientId
      - facilityId
      - departmentCode
      - tokenNumber
      - status
      - isWalkIn
      - bookedAt
      - updatedAt
      properties:
        id:
          type: string
          example: appt_01
        slotId:
          type: string
        patientId:
          type: string
        facilityId:
          type: string
        departmentCode:
          type: string
        tokenNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - booked
          - checked_in
          - in_consultation
          - completed
          - cancelled
          - no_show
        isWalkIn:
          type: boolean
        bookedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QueueState:
      type: object
      required:
      - facilityId
      - departmentCode
      - date
      - nowServing
      - lastToken
      - avgServiceTimeMinutes
      - updatedAt
      properties:
        facilityId:
          type: string
        departmentCode:
          type: string
        date:
          type: string
          format: date
        nowServing:
          type: integer
        lastToken:
          type: integer
        avgServiceTimeMinutes:
          type: number
        updatedAt:
          type: string
          format: date-time
    QueueEntry:
      type: object
      required:
      - facilityId
      - departmentCode
      - date
      - tokenNumber
      - patientId
      properties:
        facilityId:
          type: string
        departmentCode:
          type: string
        date:
          type: string
          format: date
        tokenNumber:
          type: integer
        patientId:
          type: string
        appointmentId:
          type: string
        calledAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    HealthRecord:
      type: object
      required:
      - id
      - patientId
      - facilityId
      - authorUserId
      - type
      - recordedAt
      - data
      properties:
        id:
          type: string
        patientId:
          type: string
        facilityId:
          type: string
        authorUserId:
          type: string
        appointmentId:
          type: string
        type:
          type: string
          enum:
          - consultation
          - prescription
          - lab_report
          - vaccination
        recordedAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    StockItem:
      type: object
      required:
      - medicineId
      - facilityId
      - currentQuantity
      - status
      - lastUpdatedAt
      - lastIdempotencyKey
      properties:
        medicineId:
          type: string
        facilityId:
          type: string
        currentQuantity:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - available
          - low
          - out
        lastUpdatedAt:
          type: string
          format: date-time
        lastIdempotencyKey:
          type: string
    LedgerEntry:
      type: object
      required:
      - id
      - medicineId
      - facilityId
      - eventType
      - delta
      - idempotencyKey
      - recordedAt
      properties:
        id:
          type: string
        medicineId:
          type: string
        facilityId:
          type: string
        eventType:
          type: string
          enum:
          - receipt
          - dispense
          - adjustment
          - expiry
          - transfer
        delta:
          type: integer
        idempotencyKey:
          type: string
        recordedAt:
          type: string
          format: date-time
    Complaint:
      type: object
      required:
      - id
      - patientId
      - facilityId
      - category
      - severity
      - status
      - description
      - slaDueAt
      - timeline
      - createdAt
      properties:
        id:
          type: string
        patientId:
          type: string
        facilityId:
          type: string
        category:
          type: string
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        status:
          type: string
          enum:
          - open
          - in_review
          - escalated
          - resolved
          - closed
        description:
          type: string
        slaDueAt:
          type: string
          format: date
        timeline:
          type: array
          items:
            type: object
            required:
            - status
            - note
            - updatedAt
            - updatedByUserId
            properties:
              status:
                type: string
              note:
                type: string
              updatedAt:
                type: string
                format: date-time
              updatedByUserId:
                type: string
        createdAt:
          type: string
          format: date-time
    TriageInput:
      type: object
      required:
      - patientId
      - ageMonths
      - sex
      - symptomIds
      - language
      properties:
        patientId:
          type: string
        ageMonths:
          type: integer
        sex:
          type: string
          enum:
          - male
          - female
          - other
        pregnant:
          type: boolean
        symptomIds:
          type: array
          items:
            type: string
        freeText:
          type: string
        language:
          type: string
    TriageResult:
      type: object
      required:
      - urgency
      - departmentCode
      - confidence
      - recommendedFacilityIds
      - firedRuleIds
      - matchedSymptomIds
      properties:
        urgency:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        departmentCode:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        recommendedFacilityIds:
          type: array
          items:
            type: string
        firedRuleIds:
          type: array
          items:
            type: string
        matchedSymptomIds:
          type: array
          items:
            type: string
    OtpRequestInput:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          example: '+919876543210'
    OtpRequestResponse:
      type: object
      required:
      - otpSessionId
      - expiresInSeconds
      properties:
        otpSessionId:
          type: string
        expiresInSeconds:
          type: integer
          example: 180
    OtpVerifyInput:
      type: object
      required:
      - otpSessionId
      - otp
      properties:
        otpSessionId:
          type: string
        otp:
          type: string
          example: '123456'
    AuthSessionResponse:
      type: object
      required:
      - token
      - user
      - patients
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        patients:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
    AbhaLinkInput:
      type: object
      required:
      - patientId
      - aadhaarNumber
      - otp
      properties:
        patientId:
          type: string
        aadhaarNumber:
          type: string
        otp:
          type: string
    AbhaLinkResponse:
      type: object
      required:
      - patientId
      - abhaAddress
      - aadhaarLast4
      properties:
        patientId:
          type: string
        abhaAddress:
          type: string
          example: sunita.devi@abdm
        aadhaarLast4:
          type: string
          example: '4321'
    CreatePatientInput:
      type: object
      required:
